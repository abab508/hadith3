  /* L'image EST l'interface : elle occupe tout l'écran, sans barre ajoutée. */
  #ecran {
    position: relative;
    width: min(100vw, calc(100vh * 1672 / 941));
    aspect-ratio: 1672 / 941;
    overflow: hidden;
  }
  #ecran img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    user-select: none; -webkit-user-drag: none;
  }
  #zones a {
    position: absolute; display: block; border-radius: 8px;
    border: 1px solid transparent; outline: none;
    transition: background .12s, border-color .12s, box-shadow .12s;
  }
  #zones a:hover, #zones a:focus-visible, #ecran.montrer #zones a {
    border-color: #6fd6ff; background: rgba(40, 170, 255, .14);
    box-shadow: 0 0 14px rgba(40, 170, 255, .45);
  }
  @media (prefers-reduced-motion: reduce) { #zones a { transition: none; } }

const ecran = document.getElementById('ecran');
const image = document.getElementById('image');
const zones = document.getElementById('zones');
const dejaChargees = new Set();

function precharger(slug) {
  const p = PAGES[slug];
  if (!p || dejaChargees.has(slug)) return;
  dejaChargees.add(slug);
  new Image().src = 'images/' + p.image;
}

// Toutes les zones d'une page : logo + menu du haut + menu de gauche + boutons du contenu.
function zonesDe(page) {
  const g = GRILLES[page.grille];
  const liste = [['accueil', 20, 0, 235, 62]];
  const [hy, hh, hx] = g.haut;
  HAUT.forEach((slug, i) => liste.push([slug, hx[i][0], hy, hx[i][1], hh]));
  const [cx, cl, ch, cy] = g.cote;
  [...ACAD, ...RED].forEach((slug, i) => liste.push([slug, cx, cy[i] - ch / 2, cl, ch]));
  return liste.concat(g.plus || [], page.liens || []);
}

function afficher() {
  let slug = decodeURIComponent(location.hash.slice(1));
  if (!PAGES[slug]) slug = 'accueil';
  const page = PAGES[slug];
  document.title = page.titre + ' — CyberOps';
  zones.textContent = '';
  // On attend que la nouvelle image soit affichée avant de poser ses zones,
  // pour ne jamais cliquer sur les zones d'une page par-dessus l'image d'une autre.
  image.onload = () => poserZones(slug, page);
  image.alt = 'Écran CyberOps : ' + page.titre;
  image.src = 'images/' + page.image;
}

function poserZones(slug, page) {
  zones.textContent = '';
  for (const [vers, x, y, l, h] of zonesDe(page)) {
    if (vers === slug || !PAGES[vers]) continue; // pas de lien vers la page déjà affichée
    const a = document.createElement('a');
    a.href = '#' + vers;
    a.title = PAGES[vers].titre;
    a.setAttribute('aria-label', 'Aller à : ' + PAGES[vers].titre);
    // Propriétés logiques (convention du dépôt). Le cadre est fixé en dir="ltr" :
    // les coordonnées de l'image se mesurent toujours depuis son bord gauche.
    a.style.cssText = `inset-inline-start:${x / L * 100}%;inset-block-start:${y / H * 100}%;inline-size:${l / L * 100}%;block-size:${h / H * 100}%`;
    a.addEventListener('pointerenter', () => precharger(vers));
    a.addEventListener('focus', () => precharger(vers));
    zones.appendChild(a);
  }
}

window.addEventListener('hashchange', afficher);
document.addEventListener('keydown', e => {
  if (e.key === 'h' || e.key === 'H') ecran.classList.toggle('montrer');
});
afficher();
